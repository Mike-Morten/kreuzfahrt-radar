name: Preise sammeln

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC = 07:17 Uhr deutscher Sommerzeit
  workflow_dispatch:         # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bisherige Daten laden
        run: python daten_sync.py import

      - name: Mein Schiff sammeln
        id: meinschiff
        continue-on-error: true
        run: python mein_schiff_tracker.py

      - name: AIDA sammeln
        id: aida
        continue-on-error: true
        run: python aida_tracker.py

      - name: Daten exportieren
        run: python daten_sync.py export

      - name: Fehlerantworten aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fehlerantworten
          path: letzte_fehlerantwort*.txt
          if-no-files-found: ignore

      - name: Änderungen speichern
        run: |
          git config user.name "kreuzfahrt-radar"
          git config user.email "actions@users.noreply.github.com"
          git add daten
          git diff --cached --quiet || git commit -m "Preise vom $(date +%F)"
          git push

      - name: Ergebnis prüfen
        if: steps.meinschiff.outcome == 'failure' || steps.aida.outcome == 'failure'
        run: |
          echo "::warning::Mein Schiff: ${{ steps.meinschiff.outcome }}, AIDA: ${{ steps.aida.outcome }}"
          exit 1
