name: Preise sammeln

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC = 07:17 Uhr deutscher Sommerzeit
  workflow_dispatch:         # Knopf "Run workflow" zum manuellen Starten
    inputs:
      wochenbrief:
        description: "Wochenbrief jetzt senden (Test)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bisherige Daten laden
        run: python daten_sync.py import

      - name: Mein Schiff sammeln
        id: meinschiff
        continue-on-error: true
        run: python mein_schiff_tracker.py

      - name: AIDA sammeln
        id: aida
        continue-on-error: true
        run: python aida_tracker.py

      - name: Daten exportieren
        run: python daten_sync.py export

      - name: Dashboard bauen
        run: python dashboard_bauen.py

      - name: Dashboard bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Wochenbrief senden (sonntags)
        continue-on-error: true
        env:
          MAIL_ABSENDER: ${{ secrets.MAIL_ABSENDER }}
          MAIL_PASSWORT: ${{ secrets.MAIL_PASSWORT }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
          MAIL_ANREDE: ${{ vars.MAIL_ANREDE }}
          JETZT_SENDEN: ${{ inputs.wochenbrief }}
        run: |
          if [ "$(TZ=Europe/Berlin date +%u)" != "7" ] && [ "$JETZT_SENDEN" != "true" ]; then
            echo "Heute ist nicht Sonntag – kein Wochenbrief."; exit 0
          fi
          if [ -z "$MAIL_ABSENDER" ] || [ -z "$MAIL_PASSWORT" ] || [ -z "$MAIL_EMPFAENGER" ]; then
            echo "::warning::Mail-Secrets fehlen – Wochenbrief übersprungen."; exit 0
          fi
          python wochenbrief.py

      - name: Fehlerantworten aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fehlerantworten
          path: letzte_fehlerantwort*.txt
          if-no-files-found: ignore

      - name: Änderungen speichern
        run: |
          git config user.name "kreuzfahrt-radar"
          git config user.email "actions@users.noreply.github.com"
          git add daten
          git diff --cached --quiet || git commit -m "Preise vom $(date +%F)"
          git push

      - name: Ergebnis prüfen
        if: steps.meinschiff.outcome == 'failure' || steps.aida.outcome == 'failure'
        run: |
          echo "::warning::Mein Schiff: ${{ steps.meinschiff.outcome }}, AIDA: ${{ steps.aida.outcome }}"
          exit 1

  veroeffentlichen:
    needs: sammeln
    if: always() && needs.sammeln.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Dashboard veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
